<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#7a3e28" />
<title>Bharadvaja Gundepudi & Lalitha Kannekanti | Wedding Countdown</title>
<style>
  :root{
    --maroon:#6f2f22;
    --gold:#b88a35;
    --cream:#fff8e8;
    --peach:#f6dfc1;
    --green:#52673d;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    font-family: Georgia, "Times New Roman", serif;
    color:#4a3026;
    background:
      radial-gradient(circle at 15% 10%, rgba(220,173,108,.18), transparent 24%),
      radial-gradient(circle at 85% 85%, rgba(130,72,48,.12), transparent 28%),
      linear-gradient(135deg,#fff9ea,#f7e4c6);
    display:grid;
    place-items:center;
    padding:20px;
  }
  .card{
    width:min(680px,100%);
    text-align:center;
    padding:42px 24px 34px;
    border:2px solid rgba(184,138,53,.65);
    border-radius:28px;
    background:rgba(255,250,239,.92);
    box-shadow:0 18px 50px rgba(74,48,38,.16);
    position:relative;
    overflow:hidden;
  }
  .card:before,.card:after{
    content:"✦  ✿  ✦  ❀  ✦  ✿  ✦";
    position:absolute;
    color:rgba(184,138,53,.3);
    font-size:25px;
    letter-spacing:7px;
    white-space:nowrap;
  }
  .card:before{top:12px;left:50%;transform:translateX(-50%)}
  .card:after{bottom:8px;left:50%;transform:translateX(-50%)}
  .ganesha{font-size:44px;color:var(--gold);margin-bottom:8px}
  .blessing{
    color:var(--green);
    font-size:13px;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:22px;
  }
  .names{
    font-size:clamp(32px,6.8vw,52px);
    line-height:1.08;
    color:var(--maroon);
    font-style:italic;
    margin:0;
  }
  .and{
    color:var(--gold);
    font-size:24px;
    margin:7px 0;
    font-style:italic;
  }
  .subtitle{
    margin:22px 0 6px;
    font-size:13px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#6d5647;
  }
  .date{
    font-size:clamp(26px,6vw,42px);
    color:var(--maroon);
    font-weight:bold;
    margin:6px 0 28px;
  }
  .countdown{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin:0 auto 24px;
    max-width:570px;
  }
  .unit{
    border:1px solid rgba(184,138,53,.55);
    background:linear-gradient(180deg,#fffdf5,#f8e8cf);
    border-radius:15px;
    padding:16px 7px 12px;
  }
  .number{
    font-size:clamp(28px,7vw,48px);
    line-height:1;
    color:var(--maroon);
    font-weight:bold;
  }
  .label{
    margin-top:8px;
    color:#80694f;
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
  }
  .message{
    font-size:20px;
    font-style:italic;
    color:var(--green);
    margin:14px 0 6px;
  }
  .heart{color:var(--maroon);font-size:22px}
  .footer{
    margin-top:22px;
    font-size:13px;
    letter-spacing:1px;
    color:#856d5d;
  }
  @media(max-width:420px){
    body{padding:12px}
    .card{padding:36px 14px 30px}
    .countdown{gap:7px}
    .unit{padding:13px 4px 10px;border-radius:12px}
    .label{font-size:9px;letter-spacing:.8px}
  }
</style>
</head>
<body>
  <main class="card">
    <div class="ganesha">ॐ</div>
    <div class="blessing">With divine blessings</div>

    <h1 class="names">Bharadvaja Gundepudi</h1>
    <div class="and">&amp;</div>
    <h1 class="names">Lalitha Kannekanti</h1>

    <div class="subtitle">Counting down to our wedding</div>
    <div class="date">21 November 2026</div>

    <section class="countdown" aria-label="Wedding countdown">
      <div class="unit"><div class="number" id="days">--</div><div class="label">Days</div></div>
      <div class="unit"><div class="number" id="hours">--</div><div class="label">Hours</div></div>
      <div class="unit"><div class="number" id="minutes">--</div><div class="label">Minutes</div></div>
      <div class="unit"><div class="number" id="seconds">--</div><div class="label">Seconds</div></div>
    </section>

    <div class="message" id="message">The celebration is getting closer!</div>
    <div class="heart">♥</div>
    <div class="footer">Save the date • 21.11.2026</div>
  </main>

<script>
  // Change the time here if you want a specific wedding muhurtham time.
  const weddingDate = new Date("2026-11-21T00:00:00+05:30");

  function updateCountdown(){
    const now = new Date();
    let diff = weddingDate - now;

    if(diff <= 0){
      document.getElementById("days").textContent = "0";
      document.getElementById("hours").textContent = "0";
      document.getElementById("minutes").textContent = "0";
      document.getElementById("seconds").textContent = "0";
      document.getElementById("message").textContent = "Today is the day! 💍";
      return;
    }

    const days = Math.floor(diff / 86400000);
    diff %= 86400000;
    const hours = Math.floor(diff / 3600000);
    diff %= 3600000;
    const minutes = Math.floor(diff / 60000);
    const seconds = Math.floor((diff % 60000) / 1000);

    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = String(hours).padStart(2,"0");
    document.getElementById("minutes").textContent = String(minutes).padStart(2,"0");
    document.getElementById("seconds").textContent = String(seconds).padStart(2,"0");
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);
</script>
</body>
</html>
