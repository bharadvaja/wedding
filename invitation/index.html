<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8f1e2">
<title>Lalitha & Bharadvaja | Wedding Invitation</title>
<style>
:root{--ink:#4d493d;--green:#405d46;--rose:#a64f64;--gold:#b6975c;--paper:#fbf5e8}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-snap-type:y proximity}
body{margin:0;color:var(--ink);font-family:Georgia,'Times New Roman',serif;background:#eee5d5}
section.invite-page{min-height:100svh;scroll-snap-align:start;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at 10% 12%,#ead4c7 0,transparent 38%),radial-gradient(ellipse at 90% 88%,#d4dfc6 0,transparent 40%),#f1e8d8;position:relative;overflow:hidden}
.invite-page:nth-child(2){background:radial-gradient(ellipse at 12% 12%,#f5d994 0,transparent 40%),#f7edcf}
.invite-page:nth-child(3){background:radial-gradient(ellipse at 88% 12%,#e8c5ce 0,transparent 42%),#f5e8e4}
.invite-page:nth-child(4){background:radial-gradient(ellipse at 12% 88%,#d2dfc4 0,transparent 42%),#f4ecd9}
.invite-page:nth-child(5){background:radial-gradient(ellipse at 88% 10%,#e6c6b7 0,transparent 42%),#f5e7dc}
.invite-page:nth-child(6){background:radial-gradient(ellipse at 12% 12%,#e9d8ad 0,transparent 42%),#f5efdf}
.sheet{position:relative;width:min(100%,980px);min-height:calc(100svh - 32px);display:flex;flex-direction:column;align-items:stretch;overflow:hidden;isolation:isolate;border:1px solid #c4a56d;box-shadow:0 18px 55px #5b4b3026;background:linear-gradient(145deg,#fffdf6 0%,#fbf3e3 55%,#f4ead8 100%)}
.sheet:before{content:"";position:absolute;inset:9px;border:1px solid #d7c69f;z-index:4;pointer-events:none}
.sheet:after{content:"";position:absolute;inset:15px;border:1px solid #eadfc8;z-index:4;pointer-events:none}
.hanging{position:absolute;top:0;left:0;width:100%;height:95px;z-index:3;pointer-events:none;opacity:.85}
.hanging svg{width:100%;height:100%}
.corner{position:absolute;width:clamp(90px,12vw,145px);height:clamp(110px,15vw,175px);z-index:3;pointer-events:none;opacity:.92}
.corner svg{width:100%;height:100%}
.corner.tl{top:0;left:0}.corner.tr{top:0;right:0;transform:scaleX(-1)}
.corner.bl{bottom:0;left:0;transform:scaleY(-1)}.corner.br{bottom:0;right:0;transform:scale(-1)}
.content{position:relative;z-index:2;flex:1;min-height:calc(100svh - 32px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:105px clamp(28px,6vw,76px) 14px}
.eyebrow{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#718064;margin:6px 0 12px}
.names{font-size:clamp(36px,5.5vw,62px);font-weight:400;line-height:1.04;color:var(--rose);font-style:italic;margin:2px 0 5px}
.and{font-size:22px;color:var(--gold);font-style:italic;display:block;margin:2px}
.couple-line{font-size:clamp(13px,1.55vw,16px);line-height:1.5;color:#59634f;margin:3px 0}
.couple-line strong{font-weight:600;color:#465a43}
.invite-copy{font-size:15px;line-height:1.55;max-width:420px;color:#625d50;margin:12px auto}
.title{font-size:clamp(38px,5vw,58px);font-style:italic;font-weight:400;color:var(--rose);line-height:1.05;margin:7px 0 9px}
.date{font-size:clamp(14px,1.8vw,17px);letter-spacing:.025em;color:#42664a;font-weight:bold;margin:8px 0 4px}
.time{font-size:14px;color:#625d50;margin:4px 0}
.small-label{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#9b8050;margin:12px 0 4px}
.venue{font-size:15px;line-height:1.5;color:#4d5945;margin:3px auto;max-width:360px}
.placeholder{font-style:italic;color:#8a8069;border-bottom:1px dashed #b69a62}
.lunch{font-style:italic;color:var(--rose);font-size:14px;margin:8px 0}
.divider{color:var(--gold);letter-spacing:.35em;margin:6px 0;font-size:15px}
.art{width:min(100% - 100px,700px);height:clamp(180px,24vh,245px);margin:12px auto 18px;position:relative;overflow:hidden;flex:0 0 auto;border:1px solid #ddc99f;border-radius:4px;background:#f5ead7;box-shadow:0 8px 24px #6e57301a}
.art img{display:block;width:100%;height:100%;object-fit:contain;object-position:center;background:linear-gradient(135deg,#f8eddd,#f1e5d3)}
.art img.couple-art{object-fit:contain;object-position:center;background:transparent;padding:3px}
.scene-art{width:100%;height:100%;background-image:url('../assets/ceremony-scenes.webp');background-repeat:no-repeat;background-size:300% 200%;background-color:#f6ead6}
.scene-art.haldi{background-position:50% 0%}.scene-art.mehendi{background-position:100% 0%}.scene-art.ankur{background-position:0% 100%}.scene-art.wedding{background-position:50% 100%}.scene-art.vratham{background-position:100% 100%}
.closing{font-size:14px;line-height:1.6;color:#647157;font-style:italic;margin:10px 0 5px}
.scroll-note{position:absolute;bottom:12px;left:0;right:0;z-index:6;text-align:center;font-size:9px;letter-spacing:.24em;color:#9b8558;text-transform:uppercase}
.scroll-note:after{content:"⌄";display:block;font-size:19px;line-height:1.1}
.dots{position:fixed;right:12px;top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:10px}
.dots a{width:7px;height:7px;border-radius:50%;background:#c3b28d;border:1px solid #fff;text-decoration:none}
.dots a.active{background:#a64b62;transform:scale(1.4)}
.petal-layer{position:fixed;inset:0;z-index:30;pointer-events:none;overflow:hidden}
.petal{position:absolute;top:-25px;animation:fall var(--dur) linear forwards;opacity:0;filter:drop-shadow(0 2px 2px #80613a22)}
@keyframes fall{0%{transform:translate(var(--x),-30px) rotate(0);opacity:0}12%{opacity:.85}100%{transform:translate(calc(var(--x) + var(--drift)),110vh) rotate(var(--spin));opacity:0}}
@media(max-width:640px){
 section.invite-page{padding:0}
 .sheet{width:100%;min-height:100svh;border-left:0;border-right:0}
 .content{min-height:100svh;padding:94px 22px 8px;justify-content:center}
 .eyebrow{font-size:9px;margin:5px 0 9px}
 .names{font-size:clamp(34px,9vw,48px)}
 .couple-line{font-size:13px;line-height:1.42}
 .invite-copy{font-size:13px;margin:8px auto}
 .date{font-size:14px}
 .small-label{margin:9px 0 3px}
 .venue{font-size:14px}
 .art{width:calc(100% - 64px);height:clamp(155px,21vh,205px);margin:9px auto 15px}
 .corner{width:85px;height:105px}
 .hanging{height:72px}
 .scroll-note{bottom:8px;font-size:8px}
 .dots{right:5px;gap:8px}
}
@media(max-height:760px) and (min-width:641px){
 .content{padding-top:75px}
 .art{height:150px;margin:7px auto 12px}
 .couple-line{line-height:1.35}
 .invite-copy{margin:7px auto}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.petal{display:none}}

/* Use the six supplied watercolor floral panels as full-page backgrounds */
.sheet{
 justify-content:center;
 background-image:linear-gradient(rgba(255,250,238,.18),rgba(255,250,238,.24)),url('../assets/wedding-backgrounds.webp');
 background-size:100% 100%,300% 200%;
 background-repeat:no-repeat;
}
#welcome .sheet{background-position:center,0% 0%}
#haldi .sheet{background-position:center,50% 0%}
#mehendi .sheet{background-position:center,100% 0%}
#ankurarpana .sheet{background-position:center,0% 100%}
#wedding .sheet{background-position:center,50% 100%}
#vratham .sheet{background-position:center,100% 100%}
.content{
 width:min(calc(100% - 70px),760px);
 min-height:calc(100svh - 150px);
 margin:clamp(70px,9vh,100px) auto 54px;
 padding:26px clamp(18px,4vw,48px);
 justify-content:center;
 background:rgba(255,251,241,.42);
 border:1px solid rgba(185,151,91,.5);
 border-radius:10px;
 box-shadow:0 8px 28px rgba(75,57,34,.09);
 backdrop-filter:blur(1px);
}
#welcome .content{background:rgba(255,251,241,.72)}
.art{display:none}
.sheet:before{inset:10px;border-color:rgba(175,139,78,.78)}
.sheet:after{inset:17px;border-color:rgba(255,255,255,.62)}
@media(max-width:640px){
 .content{width:calc(100% - 34px);min-height:calc(100svh - 140px);margin:66px auto 48px;padding:20px 14px;border-radius:8px}
 .names{font-size:clamp(32px,8.5vw,45px)}
 .couple-line{font-size:12.5px}
 .invite-copy{font-size:13px}
 .title{font-size:clamp(34px,8.8vw,46px)}
}
</style>
</head>
<body>
<div class="petal-layer" id="petals"></div>
<nav class="dots" aria-label="Invitation sections">
<a href="#welcome" aria-label="Welcome"></a><a href="#haldi" aria-label="Haldi"></a><a href="#mehendi" aria-label="Mehendi"></a><a href="#ankurarpana" aria-label="Ankurarpana"></a><a href="#wedding" aria-label="Wedding"></a><a href="#vratham" aria-label="Vratham"></a>
</nav>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="floral-corner" viewBox="0 0 180 200">
 <g fill="none" stroke="#71865b" stroke-width="2.2"><path d="M3 0Q45 48 105 165"/><path d="M0 12Q65 37 166 75"/><path d="M0 35Q42 95 30 190"/></g>
 <g fill="#8ba16c" stroke="#6c8758" stroke-width="1"><path d="M31 38Q-3 4 40 0Q69 15 31 38Z"/><path d="M54 55Q70 8 113 13Q104 50 54 55Z"/><path d="M75 87Q19 77 25 44Q66 43 75 87Z"/><path d="M99 121Q105 69 150 67Q143 108 99 121Z"/><path d="M34 145Q-3 116 1 84Q39 96 34 145Z"/></g>
 <g fill="#d8899b" stroke="#c66e82"><path d="M90 64q-17-23 0-37q18 14 0 37Z"/><path d="M90 64q-25 0-25-18q21-8 25 18Z"/><path d="M90 64q25 0 25-18q-21-8-25 18Z"/><circle cx="90" cy="57" r="6" fill="#e7c477" stroke="none"/></g>
 <g fill="#e7c77b"><circle cx="47" cy="109" r="4"/><circle cx="57" cy="119" r="3"/><circle cx="68" cy="127" r="3"/></g>
</symbol>
<symbol id="hanging-flowers" viewBox="0 0 500 150">
 <g fill="none" stroke="#87966a" stroke-width="1.5"><path d="M0 0Q100 35 190 4T390 12T500 0"/><path d="M38 2q-5 30 4 55M95 13q-8 28 1 48M160 13q-6 27 2 52M282 10q-6 31 2 57M365 13q-8 26 0 49M450 5q-7 29 2 55"/></g>
 <g fill="#79975e"><path d="M36 29q-24-20-27-2q13 15 27 2M42 43q22-22 28-7q-13 17-28 7M94 35q-20-17-27-2q12 14 27 2M98 48q19-20 26-5q-12 16-26 5M159 36q-21-18-28-2q14 16 28 2M165 49q20-19 27-4q-12 16-27 4M281 35q-20-18-28-2q13 16 28 2M286 48q20-18 26-3q-12 15-26 3M364 33q-20-17-27-2q13 15 27 2M370 47q20-18 27-3q-12 15-27 3M449 28q-20-17-26-2q12 14 26 2M454 43q20-18 27-3q-13 15-27 3"/></g>
 <g fill="#d78b9a"><path d="M40 62q-13-14 0-24q13 10 0 24Z"/><path d="M95 65q-13-14 0-24q13 10 0 24Z"/><path d="M162 67q-13-14 0-24q13 10 0 24Z"/><path d="M284 72q-13-14 0-24q13 10 0 24Z"/><path d="M367 64q-13-14 0-24q13 10 0 24Z"/><path d="M451 63q-13-14 0-24q13 10 0 24Z"/></g>
</symbol>
</svg>

<!-- Scenic illustration: pastel sky, distant hills, water, flowering garden and a seated couple -->
<main id="pages"></main>
<script>
function scenery(kind){
 if(kind === 'welcome'){
  return '<img class="couple-art" src="../assets/couple-portrait.svg" alt="Watercolor illustration of a South Indian bride and groom">';
 }
 const names = {haldi:'Haldi ceremony', mehendi:'Mehendi ceremony', ankur:'Ankurarpana ceremony', wedding:'Wedding mandapam', vratham:'Vratham ceremony'};
 return '<div class="scene-art ' + kind + '" role="img" aria-label="' + (names[kind] || 'Wedding ceremony') + ' watercolor artwork"></div>';
}
function frameArt(kind){return `<div class="art">${scenery(kind)}</div>`}
function frameCorners(){return `<div class="hanging"><svg viewBox="0 0 500 150"><use href="#hanging-flowers"/></svg></div>
 <div class="corner tl"><svg viewBox="0 0 180 200"><use href="#floral-corner"/></svg></div><div class="corner tr"><svg viewBox="0 0 180 200"><use href="#floral-corner"/></svg></div><div class="corner bl"><svg viewBox="0 0 180 200"><use href="#floral-corner"/></svg></div><div class="corner br"><svg viewBox="0 0 180 200"><use href="#floral-corner"/></svg></div>`}
function page(id,inner,kind,final=false){return `<section class="invite-page" id="${id}"><div class="sheet">${frameCorners()}<div class="content">${inner}${frameArt(kind)}</div></div>${final?'':'<div class="scroll-note">Scroll to continue</div>'}</section>`}
const sections=[
page('welcome',`
 <div class="eyebrow">Together with our families</div>
 <div class="names">Lalitha</div><span class="and">&amp;</span><div class="names">Bharadvaja</div>
 <div class="divider">✦ ❀ ✦</div>
 <div class="eyebrow">Bride</div><p class="couple-line"><strong>Lalitha Kannekanti</strong><br>D/o<br>Mr. Kannekanti Raja Shekhar Rao &amp;<br>Mrs. Kannekanti Uma Sravani</p>
 <span class="and">❧ And ❧</span>
 <div class="eyebrow">Groom</div><p class="couple-line"><strong>Bharadvaja Gundepudi</strong><br>S/o<br>Mr. Gundepudi Laxmi Narasimha Shastri (late) &amp;<br>Mrs. Gundepudi Padma</p>
 <p class="invite-copy">Cordially invite you to join us and bless the occasion of our wedding.</p>
 <div class="divider">✦ ❀ ✦</div><p class="date">Saturday · 21st November 2026 · 9:51 PM</p>
 <div class="small-label">Wedding venue</div><p class="venue">Achuri Gardens, MLG Road,<br>Nalgonda</p>
`,'welcome'),
page('haldi',`
 <div class="eyebrow">A morning of sunshine &amp; blessings</div><h2 class="title">Haldi / Pelllikuturu</h2>
 <div class="divider">✦ ❀ ✦</div><p class="date">19th November 2026</p><p class="time">9:00 AM onwards</p>
 <div class="small-label">Venue</div><p class="venue"><span class="placeholder">[Home – address to be added]</span></p>
 <p class="lunch">Lunch follows</p><p class="closing">Let the celebrations begin with turmeric, flowers and happy hearts.</p>
`,'haldi'),
page('mehendi',`
 <div class="eyebrow">A garden of colour &amp; joy</div><h2 class="title">Mehendi</h2>
 <div class="divider">✦ ❀ ✦</div><p class="date">Date &amp; time to be announced</p>
 <div class="small-label">Venue</div><p class="venue"><span class="placeholder">[Venue details to be added]</span></p>
 <p class="closing">Beautiful patterns, joyful moments and memories to cherish.</p>
`,'mehendi'),
page('ankurarpana',`
 <div class="eyebrow">A sacred beginning</div><h2 class="title">Ankurarpana</h2>
 <div class="divider">✦ ❀ ✦</div><p class="date">20th November 2026</p><p class="time">3:00 PM onwards</p>
 <div class="small-label">Venue</div><p class="venue"><span class="placeholder">[Home – address to be added]</span></p>
 <p class="lunch">Lunch follows</p><p class="closing">May this auspicious beginning be filled with blessings.</p>
`,'ankur'),
page('wedding',`
 <div class="eyebrow">The auspicious union</div><h2 class="title">Wedding</h2>
 <div class="divider">✦ ❀ ✦</div><p class="date">Saturday · 21st November 2026</p><p class="time">Muhurtham · 9:51 PM</p>
 <div class="small-label">Venue</div><p class="venue">Achuri Gardens,<br>MLG Road, Nalgonda</p>
 <p class="closing">Your presence and blessings will make our day complete.</p>
`,'wedding'),
page('vratham',`
 <div class="eyebrow">An auspicious family occasion</div><h2 class="title">Vratham</h2>
 <div class="divider">✦ ❀ ✦</div><p class="date">24th November 2026</p><p class="time">Time to be announced</p>
 <div class="small-label">Venue</div><p class="venue"><span class="placeholder">[Home – address to be added]</span></p>
 <p class="closing">With love and warm regards,<br>Families of Lalitha &amp; Bharadvaja</p>
`,'vratham',true)
];
document.getElementById('pages').innerHTML=sections.join('');
const nav=[...document.querySelectorAll('.dots a')],pages=[...document.querySelectorAll('.invite-page')];
const observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){nav.forEach((a,i)=>a.classList.toggle('active',pages[i]===e.target))}}),{threshold:.55});
pages.forEach(p=>observer.observe(p));
const layer=document.getElementById('petals');let last=0;
function petals(n){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const chars=['🌸','🌼','❀','🌺'];for(let i=0;i<n;i++){let p=document.createElement('span');p.className='petal';p.textContent=chars[Math.floor(Math.random()*chars.length)];p.style.left='0';p.style.setProperty('--x',Math.random()*innerWidth+'px');p.style.setProperty('--drift',(Math.random()*150-75)+'px');p.style.setProperty('--spin',(Math.random()*600-300)+'deg');p.style.setProperty('--dur',(3.8+Math.random()*2.4)+'s');p.style.fontSize=(13+Math.random()*11)+'px';layer.appendChild(p);p.addEventListener('animationend',()=>p.remove(),{once:true})}}
addEventListener('scroll',()=>{if(Date.now()-last>300){petals(innerWidth<600?2:3);last=Date.now()}},{passive:true});
addEventListener('load',()=>petals(7),{once:true});
</script>
</body></html>
